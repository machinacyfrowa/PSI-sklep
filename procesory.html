<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procesory</title>
</head>
<body>
    <h1>Procesory</h1>
    <figure>
        <img src="img/produkty/procesor.webp" alt="Procesor" width="30%">
        <figcaption>Procesor Intel Core</figcaption>
    </figure>
    <figure>
        <img src="img/produkty/amd.webp" alt="Procesor" width="30%">
        <figcaption>Procesor AMD</figcaption>
    </figure>

    <a href="index.html">Strona główna</a>
    <div style="margin-top: 14rem;"></div>
    <!-- każda tabela zaczyna się od tagu <table> i kończy tagiem </table> -->
    <table border="1" width="100%">
        <!-- tr oznacza wiersz tabeli (table row)-->
        <tr><!-- pierwszy wiersz -->
            <th>nagłówek 1 kolumny</th>
            <th>nagłówek 2 kolumny</th>
            <th>nagłówek 3 kolumny</th>
        </tr>
        <tr><!-- drugi wiersz -->
            <td colspan="2">komórka 1, komórka 1, komórka 1</td><!-- 1 kolumna -->
            <td rowspan="2">komórka 2</td><!-- 2 kolumna -->
            <!--<td>komórka 3</td>-->
        </tr>
        <tr><!-- trzeci wiersz -->
            <td>komórka 1</td>
            <td>komórka 2</td>
            <!--<td>komórka 3</td>-->
        </tr>
    </table>
</body>
</html>
