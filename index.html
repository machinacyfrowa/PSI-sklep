<!DOCTYPE html>
<!-- ^ deklaracja dokumentu w standardzie html5 -->

<!-- otwarcie html i deklaracja języka -->
<html lang="pl">
<!-- Element główny dokumentu HTML; atrybut lang określa język strony jako polski. -->

<head>
    <!-- Sekcja head zawiera metadane i informacje konfiguracyjne strony. -->
    <meta charset="UTF-8">
    <!-- Ustawia kodowanie znaków na UTF-8, aby poprawnie wyświetlać polskie znaki. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Dopasowuje szerokość strony do ekranu urządzenia i ustawia początkowe powiększenie. -->
    <title>Sklep komputerowy</title>
    <!-- Ustawia tytuł widoczny na karcie przeglądarki. -->
</head>
<!-- Zamyka sekcję metadanych dokumentu. -->

<body>
    <!-- Sekcja body zawiera treść widoczną dla użytkownika. -->
    <h1>Sklep komputerowy</h1>
    <!-- Wyświetla główny nagłówek strony. -->
    <p>Podzespoły do komputerów.
        Wysyłka w 24h</p>
    <!-- Wyświetla opis oferty oraz informację o czasie wysyłki. -->
    <h2>Procesory </h2>
    <!-- Wyświetla nagłówek sekcji poświęconej procesorom. -->
    <img src="img/produkty/procesor.webp" alt="Procesor">
    <!-- Wstawia obraz procesora i opisuje go tekstem alternatywnym. -->

</body>
<!-- Zamyka sekcję widocznej treści strony. -->

</html>
<!-- Zamyka cały dokument HTML. -->
